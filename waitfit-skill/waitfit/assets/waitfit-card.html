<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waitfit 动作卡</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f0;
      --card: #ffffff;
      --ink: #202124;
      --muted: #6b6f76;
      --line: #dde1e6;
      --accent: #226957;
      --accent-soft: #e7f2ee;
      --warn: #7d4d00;
      --warn-soft: #fff5df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    main {
      width: min(440px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      box-shadow: 0 16px 40px rgba(32, 33, 36, 0.08);
      overflow: hidden;
    }

    .top {
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 750;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
      background: #fafafa;
      white-space: nowrap;
    }

    .timer {
      padding: 20px 22px 10px;
      text-align: center;
      font-size: 56px;
      line-height: 1;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }

    .pose-wrap {
      display: grid;
      place-items: center;
      padding: 4px 22px 10px;
    }

    .pose {
      width: 170px;
      height: 170px;
      color: var(--accent);
      transition: opacity 120ms ease;
    }

    .pose svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .pose line,
    .pose path,
    .pose circle {
      vector-effect: non-scaling-stroke;
    }

    .copy {
      padding: 0 22px 18px;
    }

    .cue,
    .caution {
      margin: 0;
      border-radius: 8px;
      padding: 12px 13px;
      font-size: 15px;
      line-height: 1.55;
    }

    .cue {
      background: var(--accent-soft);
      color: #173f35;
    }

    .caution {
      margin-top: 10px;
      background: var(--warn-soft);
      color: var(--warn);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 0 22px 22px;
    }

    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      border-color: #b7c8c2;
      background: #f9fbfa;
    }

    button:active {
      transform: translateY(1px);
    }

    @media (max-width: 380px) {
      body {
        padding: 14px;
      }

      .top,
      .timer,
      .pose-wrap,
      .copy,
      .actions {
        padding-left: 16px;
        padding-right: 16px;
      }

      h1 {
        font-size: 24px;
      }

      .timer {
        font-size: 48px;
      }

      .actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main aria-label="Waitfit 动作卡">
    <section class="top">
      <h1 data-field="name"></h1>
      <div class="tags" aria-label="动作标签">
        <span class="tag" data-field="body"></span>
        <span class="tag" data-field="mode"></span>
        <span class="tag" data-field="level"></span>
      </div>
    </section>

    <div class="timer" data-field="timer" aria-live="polite">00:00</div>

    <div class="pose-wrap" aria-hidden="true">
      <div class="pose" data-field="pose"></div>
    </div>

    <section class="copy">
      <p class="cue" data-field="cue"></p>
      <p class="caution" data-field="caution"></p>
    </section>

    <div class="actions" aria-label="动作控制">
      <button type="button" data-action="swap">换一个</button>
      <button type="button" data-action="extend">加长</button>
      <button type="button" data-action="body">换部位</button>
      <button type="button" data-action="end">结束</button>
    </div>
  </main>

  <script>
    window.WAITFIT_MOVEMENT = __WAITFIT_MOVEMENT_JSON__;
    window.WAITFIT_MOVEMENTS = __WAITFIT_MOVEMENTS_JSON__;

    const poses = {

        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="53" cy="23" r="11"/><path d="M58 35 C55 49 54 60 52 72"/><path d="M52 72 L43 101"/><path d="M52 72 L68 100"/><path d="M54 48 L35 60"/><path d="M55 45 L75 31"/><path d="M77 30 C81 36 78 43 71 45"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="67" cy="23" r="11"/><path d="M62 35 C65 49 66 60 68 72"/><path d="M68 72 L52 100"/><path d="M68 72 L77 101"/><path d="M66 45 L45 31"/><path d="M65 48 L85 60"/><path d="M43 30 C39 36 42 43 49 45"/></g></svg>'
      ],
      "shoulder-circle": [
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="22" r="11"/><path d="M60 34 L60 72"/><path d="M60 72 L48 101"/><path d="M60 72 L72 101"/><path d="M37 49 L60 48 L83 49"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="22" r="11"/><path d="M60 34 L60 72"/><path d="M60 72 L48 101"/><path d="M60 72 L72 101"/><path d="M37 47 C28 38 31 29 42 29"/><path d="M83 47 C92 38 89 29 78 29"/><path d="M31 28 L35 41 L45 33"/><path d="M89 28 L85 41 L75 33"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="22" r="11"/><path d="M60 34 L60 72"/><path d="M60 72 L48 101"/><path d="M60 72 L72 101"/><path d="M37 48 C28 59 32 68 45 66"/><path d="M83 48 C92 59 88 68 75 66"/><path d="M32 69 L36 55 L46 64"/><path d="M88 69 L84 55 L74 64"/></g></svg>'
      ],
      "eye-rest": [
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="48" cy="24" r="10"/><path d="M48 36 L48 71"/><path d="M48 71 L37 101"/><path d="M48 71 L62 101"/><path d="M47 48 L31 60"/><path d="M50 48 L70 57"/><path d="M77 31 L104 31"/><path d="M92 20 L104 31 L92 42"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="24" r="10"/><path d="M50 36 L50 71"/><path d="M50 71 L39 101"/><path d="M50 71 L64 101"/><path d="M49 48 L32 58"/><path d="M52 48 L72 55"/><path d="M82 24 L104 24"/><path d="M94 14 L104 24 L94 34"/></g></svg>'
      ],
      "wrist-circle": [
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="21" r="10"/><path d="M60 33 L60 70"/><path d="M60 70 L48 101"/><path d="M60 70 L72 101"/><path d="M58 47 L38 61"/><path d="M62 47 L83 61"/><circle cx="33" cy="64" r="8"/><circle cx="88" cy="64" r="8"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="21" r="10"/><path d="M60 33 L60 70"/><path d="M60 70 L48 101"/><path d="M60 70 L72 101"/><path d="M58 47 L38 61"/><path d="M62 47 L83 61"/><circle cx="29" cy="59" r="8"/><circle cx="92" cy="69" r="8"/><path d="M20 57 C19 68 30 73 38 65"/><path d="M101 71 C102 60 91 55 83 63"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="21" r="10"/><path d="M60 33 L60 70"/><path d="M60 70 L48 101"/><path d="M60 70 L72 101"/><path d="M58 47 L38 61"/><path d="M62 47 L83 61"/><circle cx="36" cy="71" r="8"/><circle cx="85" cy="57" r="8"/><path d="M27 72 C25 61 35 55 44 61"/><path d="M94 56 C96 67 86 73 77 67"/></g></svg>'
      ],
      "seated-cat-cow": [
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="22" r="10"/><path d="M60 34 C50 48 50 64 61 75 C72 64 72 48 60 34"/><path d="M39 61 L23 72"/><path d="M80 61 L97 72"/><path d="M28 104 L92 104"/><path d="M61 75 L44 104"/><path d="M61 75 L78 104"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="62" cy="26" r="10"/><path d="M60 38 C48 44 46 60 61 72"/><path d="M39 59 L23 70"/><path d="M80 59 L97 70"/><path d="M28 104 L92 104"/><path d="M61 72 L44 104"/><path d="M61 72 L78 104"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="58" cy="18" r="10"/><path d="M58 31 C75 42 75 64 61 78"/><path d="M39 63 L23 74"/><path d="M80 63 L97 74"/><path d="M28 104 L92 104"/><path d="M61 78 L44 104"/><path d="M61 78 L78 104"/></g></svg>'
      ],
      "back-open": [
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="24" r="10"/><path d="M60 36 L60 73"/><path d="M60 73 L47 101"/><path d="M60 73 L73 101"/><path d="M40 42 C50 35 70 35 80 42"/><path d="M40 42 L33 58"/><path d="M80 42 L87 58"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="24" r="10"/><path d="M60 36 L60 73"/><path d="M60 73 L47 101"/><path d="M60 73 L73 101"/><path d="M34 42 C48 31 72 31 86 42"/><path d="M34 42 L25 60"/><path d="M86 42 L95 60"/><path d="M29 58 C45 67 75 67 91 58"/></g></svg>'
      ],
      "calf-raise": [
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="22" r="10"/><path d="M60 34 L60 73"/><path d="M60 73 L48 102"/><path d="M60 73 L72 102"/><path d="M38 48 L82 48"/><path d="M88 38 L88 99"/><path d="M43 104 L53 104"/><path d="M67 104 L77 104"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="18" r="10"/><path d="M60 30 L60 69"/><path d="M60 69 L48 98"/><path d="M60 69 L72 98"/><path d="M38 44 L82 44"/><path d="M88 34 L88 95"/><path d="M43 102 L52 97"/><path d="M68 102 L77 97"/></g></svg>'
      ],
      "standing-march": [
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="22" r="10"/><path d="M60 34 L60 71"/><path d="M60 71 L47 101"/><path d="M60 71 L73 101"/><path d="M40 50 L60 48 L80 50"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="22" r="10"/><path d="M60 34 L60 71"/><path d="M60 71 L47 101"/><path d="M60 71 L82 82 L72 97"/><path d="M40 50 L60 48 L80 56"/></g></svg>',
        '<svg viewBox="0 0 120 120" role="img"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="60" cy="22" r="10"/><path d="M60 34 L60 71"/><path d="M60 71 L38 82 L48 97"/><path d="M60 71 L73 101"/><path d="M40 56 L60 48 L80 50"/></g></svg>'
      ]
    };

    const state = {
      movement: window.WAITFIT_MOVEMENT,
      movements: Array.isArray(window.WAITFIT_MOVEMENTS) ? window.WAITFIT_MOVEMENTS : [],
      remaining: 0,
      timerId: null,
      ended: false,
      phase: 0
    };

    const fields = {
      name: document.querySelector('[data-field="name"]'),
      body: document.querySelector('[data-field="body"]'),
      mode: document.querySelector('[data-field="mode"]'),
      level: document.querySelector('[data-field="level"]'),
      timer: document.querySelector('[data-field="timer"]'),
      pose: document.querySelector('[data-field="pose"]'),
      cue: document.querySelector('[data-field="cue"]'),
      caution: document.querySelector('[data-field="caution"]')
    };

    function formatTime(seconds) {
      const safe = Math.max(0, seconds);
      const minutes = Math.floor(safe / 60);
      const rest = safe % 60;
      return `${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
    }

    function render() {
      const movement = state.movement || {};
      fields.name.textContent = movement.name || "Waitfit";
      fields.body.textContent = movement.body || "身体";
      fields.mode.textContent = movement.mode || "轻动作";
      fields.level.textContent = movement.level || "低强度";
      fields.timer.textContent = formatTime(state.remaining);
      const frames = poses[movement.pose] || poses["neck-side"];
      fields.pose.innerHTML = frames[state.phase % frames.length];
      fields.cue.textContent = movement.cue || "";
      const caution = movement.caution || "";
      fields.caution.textContent = caution.includes("痛就停，别硬拉。")
        ? caution
        : `${caution ? `${caution} ` : ""}痛就停，别硬拉。`;
    }

    function stopTimer() {
      if (state.timerId) {
        clearInterval(state.timerId);
        state.timerId = null;
      }
    }

    function startTimer(seconds) {
      stopTimer();
      state.ended = false;
      state.remaining = seconds;
      render();
      state.timerId = setInterval(() => {
        state.remaining -= 1;
        state.phase += 1;
        render();
        if (state.remaining <= 0) {
          state.remaining = 0;
          state.phase = 0;
          stopTimer();
          render();
        }
      }, 1000);
    }

    function pick(candidates) {
      if (!candidates.length) return state.movement;
      const index = Math.floor(Math.random() * candidates.length);
      return candidates[index];
    }

    function changeMovement(next) {
      if (!next) return;
      state.movement = next;
      startTimer(Number(next.duration) || 60);
    }

    function swapMovement() {
      const options = state.movements.filter((item) => item.id !== state.movement.id);
      changeMovement(pick(options));
    }

    function changeBody() {
      const options = state.movements.filter((item) => item.body !== state.movement.body);
      changeMovement(pick(options.length ? options : state.movements));
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;

      if (button.dataset.action === "swap") {
        swapMovement();
      }

      if (button.dataset.action === "extend") {
        state.remaining += 120;
        if (!state.timerId && !state.ended && state.remaining > 0) {
          startTimer(state.remaining);
        } else {
          render();
        }
      }

      if (button.dataset.action === "body") {
        changeBody();
      }

      if (button.dataset.action === "end") {
        state.ended = true;
        state.remaining = 0;
        stopTimer();
        render();
      }
    });

    changeMovement(state.movement);
  </script>
</body>
</html>
